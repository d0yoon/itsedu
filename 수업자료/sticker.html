<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Version Control: v2.03 (내부 소스 관리용 주석 기록 - 최초 보물 위치 탑재) -->
    <title>내 맘대로 보물지도 만들기</title>
    <!-- 아동용 아기자기하고 시인성이 좋은 폰트 및 아이콘 CDN 연동 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 테일윈드 CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        jua: ['Jua', 'sans-serif'],
                        noto: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f4f8;
            user-select: none;
        }

        /* 아케이드 게임기 느낌의 외곽 테두리 디자인 */
        .arcade-container {
            border: 6px solid #1e293b;
            box-shadow: 12px 12px 0px #1e293b;
        }

        /* 로봇 이동 시 부드럽고 둥실둥실한 움직임 선사 (JS 가속도 튜닝을 위한 기본값 마련) */
        #robot {
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s ease-in-out;
        }

        /* 불길 타오르는 애니메이션 */
        @keyframes fire-flicker {
            0% { transform: scale(0.95) rotate(-3deg); }
            50% { transform: scale(1.15) rotate(4deg); }
            100% { transform: scale(0.95) rotate(-3deg); }
        }

        .fire-sprite {
            animation: fire-flicker 0.4s ease-in-out infinite alternate;
        }

        /* 반짝이는 별 애니메이션 */
        @keyframes star-twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .star-item {
            animation: star-twinkle 1s infinite ease-in-out;
        }

        /* 클릭 가능한 맵 메이커 배치용 고스트 링 깜빡임 효과 */
        @keyframes ghost-pulse {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1.1); }
        }

        .ghost-anchor {
            animation: ghost-pulse 0.8s infinite alternate;
        }
    </style>
</head>

    <!-- 브라우저 주파수 합성 오디오 엔진 -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration, gainStart = 0.1) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(gainStart, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio API 제한");
            }
        }

        function playPopSound() { playTone(880, 'sine', 0.1); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.15, 0.15); // C5
            setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.15), 100); // E5
            setTimeout(() => playTone(783.99, 'triangle', 0.15, 0.15), 200); // G5
            setTimeout(() => playTone(1046.50, 'triangle', 0.4, 0.2), 300); // C6
        }
        function playExplosionSound() {
            playTone(180, 'sawtooth', 0.5, 0.2);
            playTone(90, 'triangle', 0.6, 0.35);
        }
        function playCrashSound() {
            playTone(330, 'sine', 0.2, 0.15);
            setTimeout(() => playTone(220, 'sine', 0.3, 0.15), 150);
        }
    </script>

    <!-- 격자 및 샌드박스 주행 시뮬레이터 프로그램 로직 -->
    <script>
        // 격자 표준 좌표 매핑 사전 (가로세로 비율 동일 정렬 - 3열 구조에 맞춘 너비 재배정)
        const rowCoords = [15, 38, 61, 84];
        const colCoords = [25, 50, 75];

        // 샌드박스 맵 상태 보존 변수들

        // 방향 벡터 사전 및 방향 회전도 매핑
        const directions = {
            "Up": { r: -1, c: 0, angle: -90 },

            "Down": { r: 1, c: 0, angle: 90 },

        const turnLeftMap = { "Up": "Left", "Left": "Down", "Down": "Right", "Right": "Up" };

        window.onload = function() {
            // 기본 맵 초기값 세팅 시 로봇출발 행은 3(index 3)으로 두고, 지정된 (2, 4) 위치에 초기 보물을 배치합니다.

        /**
         * 샌드박스 맵 렌더링 및 클릭 감지 존 재생성
         */

            renderHazards();

            // 4. 보물상자 렌더링 (60px 대형 상자)
            renderTreasures();

            // 5. 로봇 대기선 원복
            positionRobotAtStart();

            // 6. 클릭 앵커 핫스팟 목록 재생성
            renderClickAnchors();
        }

        /**
         * 상시 표출되는 반투명 흰색 원형 격자 도트 가이드 레이어
         */
        function renderGuides() {
            const container = document.getElementById('guidesLayer');
            container.innerHTML = '';

            // 교차로 12곳 도트 가이드
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 3; c++) {
                    createGuideDot(r, c, container);
                }
            }
            // 좌측 시작 진입로 4곳 도트 가이드
            for (let r = 0; r < 4; r++) {
                createGuideDot(r, -0.5, container);
            }
            // 우측 탈출로 4곳 도트 가이드
            for (let r = 0; r < 4; r++) {
                createGuideDot(r, 2.5, container);
            }
        }

        /**
         * 가이드 도트 한 개 생성 헬퍼
         */

            const x = getCoordPercent(c, 'x');
            const y = getCoordPercent(r, 'y');

            const dot = document.createElement('div');
            dot.className = "absolute rounded-full bg-white/50 border border-slate-900/30 shadow-sm pointer-events-none";
            dot.style.left = `calc(${x}% - 6px)`;
            dot.style.top = `calc(${y}% - 6px)`;
            dot.style.width = "12px";
            dot.style.height = "12px";
            container.appendChild(dot);
        }

        /**
         * 로봇을 지정된 왼쪽 외부 대기 라인(Row, Col -0.5)으로 정밀 안착 및 우향 전진 세팅
         */
        function positionRobotAtStart() {
            const robot = document.getElementById('robot');
            const x = getCoordPercent(-0.5, 'x');
            const y = getCoordPercent(startRow, 'y');

            // 복귀 시에는 기본적이고 안전한 아케이드 큐빅 베지어로 트랜지션 복원
            robot.style.transition = "left 0.5s cubic-bezier(0.25, 1, 0.5, 1), top 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s ease-in-out";
            robot.style.left = `calc(${x}% - 28px)`;
            robot.style.top = `calc(${y}% - 28px)`;
            currentAngle = 0; // 누적 회전 각도도 출발지로 올 때 0으로 리셋합니다.
            robot.style.transform = "rotate(0deg)"; // 기본 0도 (Right 방향)
        }

        /**
         * @param {number} val
         * @param {string} axis
         */
        function getCoordPercent(val, axis) {
            if (axis === 'x') {
                if (val === -0.5) return 6;  // 왼쪽 시작 진입지점
                if (val === 2.5) return 94;  // 오른쪽 탈출 끝지점
                
                // 정수 위치 (0, 1, 2)
                if (Number.isInteger(val)) {
                    return colCoords[val];
                }
                
                // 중간 도로 길목 위치 (0.5 단위 연산)
                const floorIdx = Math.floor(val);
                const ceilIdx = Math.ceil(val);
                if (floorIdx >= 0 && ceilIdx < 3) {
                    return (colCoords[floorIdx] + colCoords[ceilIdx]) / 2;
                }
                return 50;
            } else {
                // 정수 위치 (0, 1, 2, 3)
                if (Number.isInteger(val)) {
                    return rowCoords[val];
                }
                
                // 중간 도로 길목 위치 (0.5 단위 연산)
                const floorIdx = Math.floor(val);
                const ceilIdx = Math.ceil(val);
                if (floorIdx >= 0 && ceilIdx < 4) {
                    return (rowCoords[floorIdx] + rowCoords[ceilIdx]) / 2;
                }
                return 50;
            }
        }

        /**
         * 도구 선택 및 토글 제어 이벤트 핸들러 (동일 버튼 재클릭 시 배치 완료 상태 전환)
         */
        function selectTool(toolId) {
            if (isSimulating) return;

            // [토글 해제 메커니즘] 이미 활성화된 도구를 한 번 더 터치한 경우 (토글 해제!)
            if (selectedTool === toolId) {
                selectedTool = null;
                playTone(523.25, 'sine', 0.1, 0.05); // 도구 해제 알림음
                
                // 모든 버튼의 하이라이트 테두리 회수
                const tools = ['tool-robot', 'tool-fire', 'tool-treasure', 'sticker-blue', 'sticker-green', 'sticker-yellow'];
                tools.forEach(t => {
                    const el = document.getElementById(t);
                    if (el) {
                        el.classList.remove('scale-105', 'border-yellow-300', 'ring-4', 'ring-indigo-300');
                    }
                });
                
                // 앵커 링 레이어를 제거하여 도화지처럼 순수하게 복원
                renderClickAnchors();
                
                // 배치가 무사히 완료되었음을 아동의 눈에 각인시키는 축하 멘트 출력
                document.getElementById('systemMessage').innerHTML = "👍 배치가 완료되었습니다! 이제 상단의 [로봇 출발] 버튼을 눌러 테스트해 보세요!";
                document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-emerald-600 tracking-wide animate-pulse";
                return;
            }

            // 모든 기존 하이라이트 스타일 회수
            const tools = ['tool-robot', 'tool-fire', 'tool-treasure', 'sticker-blue', 'sticker-green', 'sticker-yellow'];
            tools.forEach(t => {
                const el = document.getElementById(t);
                if (el) {
                    el.classList.remove('scale-105', 'border-yellow-300', 'ring-4', 'ring-indigo-300');
                }
            });

            selectedTool = toolId;
            playPopSound();

            // 선택된 신규 도구에 쫀득한 링 하이라이트 부여
            const activeBtn = document.getElementById(toolId);
            if (activeBtn) {
                activeBtn.classList.add('scale-105', 'border-yellow-300', 'ring-4', 'ring-indigo-300');
            }

            // 활성화된 도구 신호에 따라 맵 배치 앵커들을 다시 그려 안내선을 강조
            renderClickAnchors();

            // 각 도구별 상세 행동 가이드라인 하단 출력
            if (toolId === 'tool-robot') {
                document.getElementById('systemMessage').innerText = "🤖 왼쪽 시작 도로 중 하나를 클릭해 로봇의 출발 행 위치를 정해주세요.";
            } else if (toolId === 'tool-fire') {
                document.getElementById('systemMessage').innerText = "🔥 지도의 교차로를 클릭해 장애물 불꽃을 세우세요. (다시 누르면 떼어짐)";
            } else if (toolId === 'tool-treasure') {
                document.getElementById('systemMessage').innerText = "💎 교차로나 도로 끝부분을 터치하여 보물상자들을 자유롭게 배치하세요. (다시 누르면 떼어짐)";
            } else {
                document.getElementById('systemMessage').innerText = "🔵🟢🟡 지도 위 도로 교차로를 클릭해 해당 코딩 스티커를 부착하세요! (다시 누르면 떼어짐)";
            }
            document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-slate-600 tracking-wide";
        }

        /**
         * 현재 활성화된 배치 도구에 따른 핫스팟 투명 감지 링 렌더링
         */
        function renderClickAnchors() {
            const container = document.getElementById('anchorsLayer');
            container.innerHTML = '';

            if (isSimulating || !selectedTool) return;

            // 1. [로봇 배치] 도구 핫스팟 (왼쪽 입구 4곳)
            if (selectedTool === 'tool-robot') {
                for (let r = 0; r < 4; r++) {
                    const x = getCoordPercent(-0.5, 'x');
                    const y = getCoordPercent(r, 'y');

                    const anchor = document.createElement('button');
                    anchor.className = "absolute rounded-full border-4 border-dashed border-indigo-400 bg-white/70 flex items-center justify-center ghost-anchor z-30 shadow-md pointer-events-auto";
                    anchor.style.left = `calc(${x}% - 22px)`;
                    anchor.style.top = `calc(${y}% - 22px)`;
                    anchor.style.width = "44px";
                    anchor.style.height = "44px";
                    anchor.innerHTML = `<i class="fa-solid fa-car-side text-indigo-500 text-sm"></i>`;
                    
                    anchor.onclick = () => {
                        startRow = r;
                        // 로봇이 새로 배치되는 출발 위치에 보물상자가 이미 있다면 자동으로 수거(제거)하여 동기화
                        delete treasures[`${r},-0.5`];
                        playTone(660, 'sine', 0.1);
                        initMap();
                    };
                    container.appendChild(anchor);
                }
                return;
            }

            // 2. [불 배치] 핫스팟 (오직 12개 정수 교차로 영역만 허용)
            if (selectedTool === 'tool-fire') {
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 3; c++) {
                        const x = getCoordPercent(c, 'x');
                        const y = getCoordPercent(r, 'y');
                        const key = `${r},${c}`;

                        const anchor = document.createElement('button');
                        anchor.className = "absolute rounded-full flex items-center justify-center z-30 transition pointer-events-auto";
                        anchor.style.left = `calc(${x}% - 24px)`;
                        anchor.style.top = `calc(${y}% - 24px)`;
                        anchor.style.width = "48px";
                        anchor.style.height = "48px";
                        // 투명 터치 핫스팟 가이드 (마우스 호버 시에만 원형 보더 노출)
                        anchor.innerHTML = `<div class="w-10 h-10 rounded-full border-4 border-dashed border-transparent hover:border-slate-400/60 transition"></div>`;

                        anchor.onclick = () => {
                            if (hazards[key]) {
                                // 이미 불길이 깔려있을 때 한 번 더 클릭하면 삭제 (토글 완벽 적용!)
                                delete hazards[key];
                                playTone(440, 'sine', 0.08);
                            } else {
                                delete treasures[key]; // 보물과 동시 겹침 차단
                                delete boardStickers[key]; // 불길을 놓을 때는 코딩 스티커를 자동 삭제하여 겹침 방지
                                hazards[key] = true;
                                playTone(660, 'sine', 0.15);
                            }
                            initMap();
                        };
                        container.appendChild(anchor);
                    }
                }
                return;
            }

            // 3. [보물 배치] 핫스팟 (12개 교차로 + 좌측 4곳 + 우측 4곳 허용)
            if (selectedTool === 'tool-treasure') {
                const list = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 3; c++) list.push({ r: r, c: c });
                }
                for (let r = 0; r < 4; r++) {
                    list.push({ r: r, c: -0.5 });
                    list.push({ r: r, c: 2.5 });
                }

                list.forEach(pos => {
                    const key = `${pos.r},${pos.c}`;
                    const x = getCoordPercent(pos.c, 'x');
                    const y = getCoordPercent(pos.r, 'y');

                    const anchor = document.createElement('button');
                    anchor.className = "absolute rounded-full flex items-center justify-center z-30 transition pointer-events-auto";
                    anchor.style.left = `calc(${x}% - 24px)`;
                    anchor.style.top = `calc(${y}% - 24px)`;
                    anchor.style.width = "48px";
                    anchor.style.height = "48px";
                    anchor.innerHTML = `<div class="w-10 h-10 rounded-full border-4 border-dashed border-transparent hover:border-slate-400/60 transition"></div>`;

                    anchor.onclick = () => {
                        if (treasures[key]) {
                            // 이미 보물이 깔려있을 때 한 번 더 누르면 리셋
                            delete treasures[key];
                            playTone(440, 'sine', 0.08);
                        } else {
                            // [반영 완료] 로봇이 이미 출발 대기 중인 위치(startRow, -0.5)에는 보물을 놓을 수 없도록 배치 예외 제어!
                            if (pos.r === startRow && pos.c === -0.5) {
                                document.getElementById('systemMessage').innerText = "⚠️ 로봇이 출발하는 위치에는 보물을 놓을 수 없어요!";
                                document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-rose-500 animate-pulse";
                                playCrashSound();
                                return;
                            }
                            // [겹침 제한 해제 완료] 보물상자와 색상 스티커는 겹칠 수 있으므로 더이상 boardStickers를 지우지 않습니다.
                            delete hazards[key];
                            treasures[key] = true;
                            playTone(783.99, 'sine', 0.15);
                        }
                        initMap();
                    };
                    container.appendChild(anchor);
                });
                return;
            }

            // 4. [코딩 스티커] 핫스팟 (유연한 예외 및 허용 규칙 적용)
            if (selectedTool.startsWith('sticker-')) {
                const type = selectedTool.replace('sticker-', '');
                
                // [골드 피드백 반영] 파란색(유턴) 스티커만 5번째 지점(2.5)에 부착할 수 있도록 필터링 처리합니다!
                // 연두색(우회전) 및 노란색(좌회전) 스티커를 선택했을 때는 5번째 칸이 선택 가이드 영역에서 완벽하게 제외됩니다.
                const cols = (type === 'blue') ? [0, 1, 2, 2.5] : [0, 1, 2];
                
                for (let r = 0; r < 4; r++) {
                    cols.forEach(c => {
                        const x = getCoordPercent(c, 'x');
                        const y = getCoordPercent(r, 'y');
                        const key = `${r},${c}`;

                        const anchor = document.createElement('button');
                        anchor.className = "absolute rounded-full flex items-center justify-center z-30 transition pointer-events-auto";
                        anchor.style.left = `calc(${x}% - 24px)`;
                        anchor.style.top = `calc(${y}% - 24px)`;
                        anchor.style.width = "48px";
                        anchor.style.height = "48px";
                        anchor.innerHTML = `<div class="w-10 h-10 rounded-full border-4 border-dashed border-transparent hover:border-slate-400/60 transition"></div>`;

                        anchor.onclick = () => {
                            const exist = boardStickers[key];
                            
                            // 이미 그 교차로에 나와 같은 종류의 스티커가 붙은 상태에서 재클릭 시 -> 깔끔하게 삭제!
                            if (exist === type) {
                                delete boardStickers[key];
                                playTone(440, 'sine', 0.08);
                            } else {
                                // [수정 반영] 불길이 있는 교차로에만 원천 차단! (보물상자가 위치한 자리에는 스티커를 올릴 수 있게 제한 해제)
                                if (hazards[key]) {
                                    document.getElementById('systemMessage').innerText = "⚠️ 불길이 이미 설치된 교차로에는 코딩 스티커를 배치할 수 없어요!";
                                    document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-rose-500 animate-pulse";
                                    playCrashSound();
                                    return;
                                }
                                // 다른 색상의 스티커 덮어쓰기 및 새로운 부착
                                boardStickers[key] = type;
                                playTone(660, 'sine', 0.1);
                            }
                            initMap();
                        };
                        container.appendChild(anchor);
                    });
                }
            }
        }

        /**
         * 비동기 타이머 도우미 (동작 딜레이 관리)
         */
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        /**
         * [로봇 출발] 버튼 클릭 시 설계된 알고리즘 주행 연산 가동 (3열 구조 경계 연산 및 다중 보물 획득 제어 최적화)
         */
        async function startSimulation() {
            if (isSimulating) return;

            // 보물이 하나도 깔려있지 않은 경우 경고
            if (Object.keys(treasures).length === 0) {
                document.getElementById('systemMessage').innerText = "⚠️ 보물상자(💎)를 지도 위에 먼저 배치하고 출발시켜 주세요!";
                document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-rose-500 animate-pulse";
                playCrashSound();
                return;
            }

            isSimulating = true;
            
            // 모든 도구 조작 링 회수 및 비활성화 (전면 대기 상태 전환)
            selectTool(null);

            const robot = document.getElementById('robot');
            positionRobotAtStart();

            // 다중 보물 실시간 수거 상태 초기 복사
            activeTreasures = { ...treasures };
            const totalTreasuresCount = Object.keys(treasures).length;
            let collectedCount = 0;

            // 최초 closed 보물 상태 보장
            renderTreasures(activeTreasures);

            document.getElementById('systemMessage').innerHTML = "<span class='text-indigo-600 animate-pulse'>주행 테스트 개시! 설계된 코딩 규칙을 한 칸씩 추적합니다... 🚀</span>";
            document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl tracking-wide";

            await sleep(600);

            // 주행 상태 좌표 변수 초기화 (float 및 half-step 지원)
            let currR = startRow;
            let currC = -0.5; // ① 왼쪽 출발 도로 바깥에서 진입
            let currentDir = "Right"; // 첫 전진은 무조건 우측 직진
            currentAngle = 0; // 누적 방향 각도 초기화

            const maxHalfSteps = 50; // 무한 루프 방지 임계선
            let steps = 0;

            while (steps < maxHalfSteps) {
                steps++;

                // 이전 로봇 위치 좌표 보존 (물리적 주행 속도 비례 연산용)
                const prevR = currR;
                const prevC = currC;

                // [주행 속도 조율 패치 완벽 교정]
                // 수직(Up/Down) 이동은 1.0 간격으로, 수평(Left/Right) 이동은 노드 기반(colNodes)으로 탐색하여
                // 어떠한 경우에도 중간 지점에 멈추지 않고 오직 노드에서 노드로 무조건 한 번에 이동하도록 수정되었습니다!
                if (currentDir === 'Up') {
                    currR -= 1;
                } else if (currentDir === 'Down') {
                    currR += 1;
                } else if (currentDir === 'Right') {
                    const idx = colNodes.indexOf(currC);
                    if (idx !== -1 && idx < colNodes.length - 1) {
                        currC = colNodes[idx + 1];
                    } else {
                        currC += 0.5; // fallback 예외안전선
                    }
                } else if (currentDir === 'Left') {
                    const idx = colNodes.indexOf(currC);
                    if (idx !== -1 && idx > 0) {
                        currC = colNodes[idx - 1];
                    } else {
                        currC -= 0.5; // fallback 예외안전선
                    }
                }

                // 위치 정보 key 생성
                const key = `${currR},${currC}`;

                // [v1.06 패치: 등속 주행 물리 엔진 연산]
                // 이전 좌표와 다음 이동 좌표 사이의 물리적 거리(%) 차이를 구한 다음,
                // 이에 비례하도록 CSS transition-duration을 완벽하게 동적 보정하여
                // 좁은 구간이든 넓은 구간이든 속도가 늘어지거나 급감하는 현상을 원천 방지하여 동일한 속도로 전진하게 만듭니다.
                const percentX_prev = getCoordPercent(prevC, 'x');
                const percentY_prev = getCoordPercent(prevR, 'y');
                const percentX_next = getCoordPercent(currC, 'x');
                const percentY_next = getCoordPercent(currR, 'y');

                const travelDistance = Math.sqrt(Math.pow(percentX_next - percentX_prev, 2) + Math.pow(percentY_next - percentY_prev, 2));
                
                // 표준 등속도 기준: 격자 교차로간 25% 거리를 0.4초 동안 이동하도록 설정
                const finalDuration = (travelDistance / 25) * 0.4;
                const clampedDuration = Math.max(0.2, Math.min(0.5, finalDuration)); // 예외 범위 보호 장치

                // 등속 주행 트랜지션 실시간 동적 주입
                robot.style.transition = `left ${clampedDuration}s ease-in-out, top ${clampedDuration}s ease-in-out, transform 0.3s ease-in-out`;

                // ② 화면 내 로봇 좌표 위치 부드럽게 대칭 이동
                robot.style.left = `calc(${percentX_next}% - 28px)`;
                robot.style.top = `calc(${percentY_next}% - 28px)`;

                // 트랜지션 작동 소요 시간만큼 완벽하게 동기화 대기 (정지 후 미세 지연 정체 완벽 차단)
                await sleep(clampedDuration * 1000);

                // 개별 보물상자 실시간 획득 감지 및 체크
                if (activeTreasures[key]) {
                    delete activeTreasures[key]; // 수거 처리
                    collectedCount++;
                    
                    // 기분 좋은 맑은 포장/수집 소리 출력
                    playTone(880, 'sine', 0.15, 0.15); 
                    
                    // 현재 남은 활성 보물만 재렌더링 (획득한 것은 열린 보물상자로 전환)
                    renderTreasures(activeTreasures); 
                    
                    // 특수학급 아이들을 위해 현재 획득 상태 전광판 실시간 갱신
                    document.getElementById('systemMessage').innerHTML = `⭐ 보물 상자를 열었습니다! (${collectedCount} / ${totalTreasuresCount}개 획득)`;
                    document.getElementById('systemMessage').className = "font-jua text-2xl text-indigo-600 tracking-wide animate-bounce";
                    
                    await sleep(350);
                }

                // 목적지 보물 상자를 전부 안전하게 모았을 때 최종 대성공 선언! (모두 획득 성공 조건 적용)
                if (Object.keys(activeTreasures).length === 0) {
                    playSuccessSound();
                    document.getElementById('systemMessage').innerHTML = "🎉 대성공! 모든 보물을 안전하게 전부 획득했습니다!";
                    document.getElementById('systemMessage').className = "font-jua text-2xl text-emerald-500 tracking-wide";
                    
                    await sleep(400);
                    document.getElementById('successModal').classList.remove('hidden');
                    isSimulating = false;
                    return;
                }

                // ③ 지옥 불길 충돌 체크
                if (hazards[key]) {
                    playExplosionSound();
                    document.getElementById('systemMessage').innerHTML = "💥 불이야! 뜨겁게 타오르는 불길과 조우하여 로봇 부품이 고장 났습니다. 지도를 재설계해 주세요!";
                    document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-rose-500 tracking-wide";
                    isSimulating = false;
                    return;
                }

                // ④ 도로 이탈 벽 충돌 체크 (3열 경계인 2.5로 제한 상향 조정)
                if (currR < 0 || currR > 3 || currC < -0.5 || currC > 2.5) {
                    playCrashSound();
                    document.getElementById('systemMessage').innerHTML = "🚧 탈선! 로봇이 도로 밖 성벽과 쿵 부딪혔습니다. 교차로 스티커를 다시 점검해 주세요!";
                    document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-rose-500 tracking-wide";
                    isSimulating = false;
                    return;
                }

                // ⑤ 정확한 정수형 '교차로' 또는 오른쪽 끝(2.5, 즉 5번째 포인트)에 도달했을 때 부착된 코딩 스티커를 읽고 90도/180도 회전 지시 처리
                if (Number.isInteger(currR) && (Number.isInteger(currC) || currC === 2.5)) {
                    const sticker = boardStickers[key];
                    if (sticker) {
                        if (sticker === 'blue') {
                            currentDir = uTurnMap[currentDir];
                            currentAngle += 180; // 유턴: 180도 추가
                        } else if (sticker === 'green') {
                            currentDir = turnRightMap[currentDir];
                            currentAngle += 90;  // 우회전: 시계방향 (+90도)
                        } else if (sticker === 'yellow') {
                            currentDir = turnLeftMap[currentDir];
                            currentAngle -= 90;  // 좌회전: 반시계방향 (-90도)
                        }

                        // 누적된 각도를 적용하여 270도 공전 없이 최단 경로로 회전합니다.
                        robot.style.transform = `rotate(${currentAngle}deg)`;
                        await sleep(400);
                    }
                }
            }

            // 배터리 방전 타임아웃
            playCrashSound();
            document.getElementById('systemMessage').innerText = "⌛ 무한 루프 감지! 로봇의 에너지가 모두 닳아 정지했습니다.";
            isSimulating = false;
        }

        /**
         * 주행 오류 후 복귀용 로봇 리셋 처리 (열렸던 보물상자 일제히 복원)
         */
        function resetSimulation() {
            if (isSimulating) return; // 주행 도중 강제 중단 방지
            positionRobotAtStart();
            initMap(); // 전체 상태 동기화 재렌더링으로 열린 보물상자들 일제히 closed 복원!
            document.getElementById('systemMessage').innerText = "로봇이 시작 위치로 무사히 복귀했습니다. 코딩을 계속해 보세요!";
            document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-slate-500 tracking-wide";
        }

        /**
         * 지도 내의 모든 스티커, 장애물, 보물을 통째로 들어내어 하얀 도화지로 되돌리기
         */
        function clearEverything() {
            if (isSimulating) return;

            boardStickers = {};
            hazards = {};
            treasures = {};
            startRow = 3; // 4행 시작 기본값 초기화

            playTone(220, 'sine', 0.2);
            initMap();

            document.getElementById('systemMessage').innerText = "도면이 하얗게 비워졌습니다! 자유롭게 미션을 제작해 보세요.";
            document.getElementById('systemMessage').className = "font-jua text-xl md:text-2xl text-slate-500 tracking-wide";
        }

        /**
         * 모달 창 닫기
         */
        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            resetSimulation();
        }
    </script>
