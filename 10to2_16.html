    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fcf9f5;
            user-select: none;
        }

        /* [크기 22px 최적화] 격자 정렬 시 봉투 영역 안에 완벽하게 정돈되도록 미세 조율 */
        .dot {
            width: 22px;
            height: 22px;
            background-color: #e2b381; /* 골드 쿠키 브라운 */
            border-radius: 50%;
            position: relative;
            box-shadow: inset -2px -2px 0px #c59462, 0.5px 1px 2px rgba(0,0,0,0.18);
            border: none;
            transition: transform 0.2s ease;
        }

        /* 디폴트 초코칩 콕콕 박기 */
        .dot::before {
            content: '';
            position: absolute;
            width: 3.5px;
            height: 3.5px;
            background-color: #503117; /* 다크 초콜릿 */
            border-radius: 50%;
            top: 4px;
            left: 5px;
            box-shadow: 9px 1.5px 0 #503117, 1.5px 11px 0 #503117, 9px 9px 0 #41240c;
        }

        /* [포장 완료(담음) 시 개별 쿠키 투명 비닐 랩핑 효과 크기 최적화] */
        .bag-card.packed .dot::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: 32px; /* 쿠키 크기에 맞춰 조정 */
            height: 32px;
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            /* 반짝이는 투명 셀로판 비닐 질감 렌더링 */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.45) 100%);
            border-radius: 6px; /* 귀여운 사각형 개별 포장지 */
            box-shadow: 0 1.5px 3px rgba(0,0,0,0.15), inset 0 0 3px rgba(255,255,255,0.7);
            pointer-events: none;
            z-index: 10;
        }

        /* 활성화 상태일 때 쿠키 통통 튀는 애니메이션 */
        .bag-card.packed .dot {
            transform: scale(1.15);
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1.15); }
            100% { transform: translateY(-3px) scale(1.15); }
        }

        /* 가방 카드 트랜지션 효과 */
        .bag-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .bag-card.packed {
            border-color: #2ecc71 !important;
            background-color: #e8f8f0 !important;
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(46, 204, 113, 0.2);
        }

        .bag-svg {
            transition: transform 0.3s ease;
        }

        .bag-card.packed .bag-svg {
            transform: scale(1.08);
        }

        /* 부드러운 토스트 메시지 애니메이션 */
        .toast-animation {
            animation: slideDownFade 0.3s ease-out forwards;
        }

        @keyframes slideDownFade {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

                        <path d="M92 150 Q100 160 108 150" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                    </svg>

                <!-- 1개 도트 컨테이너 (v1.22: 한 개의 쿠키를 중앙에 정적 배치) -->
                <div class="flex justify-center items-center h-[105px] my-1.5">
                    <div class="dot"></div>
                </div>
                <!-- 하단 라벨 정보 -->
                <div class="flex items-center justify-center gap-2 w-full bg-[#f5efe6] px-2 py-1.5 rounded-xl border border-[#ebdcd0] shadow-inner">
                    <span class="font-jua text-base md:text-lg text-[#4a3e3d] whitespace-nowrap">1개 봉투 :</span>

        </div>

        <!-- 하단 잔잔한 가이드 라인 및 버전 표시 -->
        <div class="border-t-2 border-dashed border-[#eedecc] pt-1 flex justify-between items-center px-4 text-[11px] text-[#a89a93] font-bold">
            <span>이진수 초코칩 포장 마법 상점 - 깨비 교육과정 재구성 모델</span>
            <span class="bg-[#eedecc] px-2 py-0.5 rounded-full text-[#7f6f67]">v1.26</span>
        </div>

        <!-- [v1.25 레이아웃 반영] 알림용 플로팅 토스트 컨테이너 -->
        <div id="toastContainer" class="absolute top-16 left-1/2 -translate-x-1/2 z-40 w-11/12 max-w-md pointer-events-none flex flex-col items-center gap-2"></div>

    </div>

    <!-- [v1.19/v1.21] 대성공 이진수 변환 해독기 대형 팝업 모달창 (5비트 정밀 동기화) -->
    <div id="successModal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[32px] border-8 border-[#ebdcd0] max-w-lg w-11/12 p-6 md:p-8 shadow-2xl relative transform scale-90 transition-transform duration-300 flex flex-col items-center">
            
            <!-- 아기자기한 축하 헤더 아이콘 -->
            <div class="text-5xl md:text-6xl mb-3 animate-bounce">🎁</div>
            <h2 class="font-jua text-3xl md:text-4xl text-[#ff7675] text-center mb-1">🎉 포장 성공! 🎉</h2>
            <p class="font-jua text-base md:text-lg text-[#7f5f00] bg-[#ffeaa7] px-4 py-1.5 rounded-full border border-[#f1c40f] mb-6 text-center leading-relaxed">
                주문한 초코칩 <span id="popupTarget" class="text-red-500 font-bold font-jua text-2xl md:text-3xl mx-1 underline decoration-wavy">0</span>개를 모두 완벽하게 포장했어요!
            </p>

            <!-- 초대형 이진수 전광판 카드 레이아웃 (5개 카드 배치) -->
            <div class="flex justify-center items-center gap-2 w-full mb-6">
                <!-- 16개 봉투 자리 -->
                <div class="flex flex-col items-center gap-1 flex-1">
                    <span class="font-jua text-[9px] md:text-xs text-[#a89a93] whitespace-nowrap">16개 봉투</span>
                    <div id="bit16" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-2xl md:text-3xl rounded-2xl transition-all shadow-md">0</div>
                </div>
                <!-- 8개 봉투 자리 -->
                <div class="flex flex-col items-center gap-1 flex-1">
                    <span class="font-jua text-[9px] md:text-xs text-[#a89a93] whitespace-nowrap">8개 봉투</span>
                    <div id="bit8" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-2xl md:text-3xl rounded-2xl transition-all shadow-md">0</div>
                </div>
                <!-- 4개 봉투 자리 -->
                <div class="flex flex-col items-center gap-1 flex-1">
                    <span class="font-jua text-[9px] md:text-xs text-[#a89a93] whitespace-nowrap">4개 봉투</span>
                    <div id="bit4" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-2xl md:text-3xl rounded-2xl transition-all shadow-md">0</div>
                </div>
                <!-- 2개 봉투 자리 -->
                <div class="flex flex-col items-center gap-1 flex-1">
                    <span class="font-jua text-[9px] md:text-xs text-[#a89a93] whitespace-nowrap">2개 봉투</span>
                    <div id="bit2" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-2xl md:text-3xl rounded-2xl transition-all shadow-md">0</div>
                </div>
                <!-- 1개 봉투 자리 -->
                <div class="flex flex-col items-center gap-1 flex-1">
                    <span class="font-jua text-[9px] md:text-xs text-[#a89a93] whitespace-nowrap">1개 봉투</span>
                    <div id="bit1" class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-2xl md:text-3xl rounded-2xl transition-all shadow-md">0</div>
                </div>
            </div>

            <!-- 마법 해석 자막 -->
            <p class="text-center font-semibold text-[#4a3e3d] text-sm md:text-base mb-6 leading-relaxed bg-[#fdfbf7] p-3.5 rounded-2xl border border-[#eedecc] w-full shadow-inner">
                마법 상점의 마법 컴퓨터는 초코칩 <span id="popupTargetText" class="text-emerald-600 font-jua text-2xl md:text-3xl mx-1 font-bold underline">5</span>개를 <br>
                반짝이는 이진수 마법코드 <span id="popupBinaryText" class="text-[#ff7675] font-jua text-2xl md:text-3xl ml-1 bg-yellow-100 px-2.5 py-0.5 rounded-xl border border-yellow-200">0 1 0 1 0</span>(으)로 읽어 들인답니다!
            </p>

            <!-- 닫기 및 다음 행동 버튼 -->
            <button onclick="closeSuccessModal()" class="w-full bg-[#2ecc71] hover:bg-[#27ae60] active:translate-y-0.5 text-white font-jua text-lg md:text-xl py-3 px-6 rounded-2xl border-2 border-slate-800 shadow-md transition duration-200">
                확인 (다음 주문 받기)
            </button>
        </div>
    </div>

    <!-- 브라우저 자체 주파수 합성 오디오 엔진 (효과음 탑재) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration, gainValue = 0.08) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainValue, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio API 제한 상태");
            }
        }

        function playPopSound() { playTone(880, 'sine', 0.1); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.15); // C5
            setTimeout(() => playTone(659.25, 'triangle', 0.15), 100); // E5
            setTimeout(() => playTone(783.99, 'triangle', 0.15), 200); // G5
            setTimeout(() => playTone(1046.50, 'triangle', 0.35, 0.12), 300); // C6
        }
        function playFailSound() {
            playTone(220, 'sawtooth', 0.25); // A3
            setTimeout(() => playTone(147, 'sawtooth', 0.3, 0.12), 120); // D3
        }
    </script>

    <!-- 게임 및 제어 연동 스크립트 -->
    <script>
        // 각 가방의 활성화/포장 여부 (16개 봉투 추가 포함 5비트 이진수 상태)
        let packedBags = { 16: false, 8: false, 4: false, 2: false, 1: false };

        /**
         * [v1.25 레이아웃 반영] 알림용 플로팅 토스트 표시 함수
         * @param {string} msg - 알림 메시지 내용
         * @param {string} type - 'success', 'warning', 'error' 등
         */
        function showFloatingToast(msg, type = 'warning') {
            const container = document.getElementById('toastContainer');
            
            // 기존 토스트 모두 제거
            container.innerHTML = '';

            const toast = document.createElement('div');
            toast.className = `toast-animation px-5 py-3 rounded-2xl shadow-lg border-2 font-jua text-sm sm:text-base tracking-wide flex items-center gap-2 pointer-events-auto bg-white`;
            
            if (type === 'error') {
                toast.className += ' border-rose-500 text-rose-600 bg-rose-50';
                toast.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            } else {
                toast.className += ' border-amber-400 text-amber-600 bg-amber-50';
                toast.innerHTML = `<i class="fa-solid fa-cookie-bite"></i> ${msg}`;
            }

            container.appendChild(toast);

            // 3.5초 뒤 자동으로 사라지게 설정
            setTimeout(() => {
                toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-15px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        /**
         * 특정 크기의 봉투를 꾹 눌러 담거나 내리기 토글 제어
         * @param {number} size - 토글할 가방의 크기 단위 (16, 8, 4, 2, 1)
         */
        function toggleBag(size) {
            playPopSound();
            packedBags[size] = !packedBags[size];
            
            const card = document.getElementById('bag' + size);
            const indicator = document.getElementById('indicator' + size);

            if (packedBags[size]) {
                card.classList.add('packed');
                indicator.innerText = '1';
                indicator.classList.replace('text-[#94a3b8]', 'text-emerald-600');
                indicator.classList.add('scale-110', 'font-bold');
            } else {
                card.classList.remove('packed');
                indicator.innerText = '0';
                indicator.classList.replace('text-emerald-600', 'text-[#94a3b8]');
                indicator.classList.remove('scale-110', 'font-bold');
            }
        }

        /**
         * 시뮬레이터 포장값 리셋 연동 (5비트 리셋)
         */
        function resetSimulator() {
            packedBags = { 16: false, 8: false, 4: false, 2: false, 1: false };
            const sizes = [16, 8, 4, 2, 1];
            sizes.forEach(size => {
                const card = document.getElementById('bag' + size);
                const indicator = document.getElementById('indicator' + size);
                
                card.classList.remove('packed');
                indicator.innerText = '0';
                indicator.className = "font-jua text-2xl md:text-3xl text-[#94a3b8] transition-all duration-300 leading-none";
            });

            // 기존 알림창 지우기
            document.getElementById('toastContainer').innerHTML = '';
        }

        /**
         * 대성공 시 신나게 터지는 좌우 폭죽과 꽃가루 샤워 시퀀스
         */
        function triggerFireworks() {
            if (typeof confetti === 'function') {
                // 1단계: 좌측 하단 및 우측 하단 동시 폭죽 분사
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { x: 0.15, y: 0.85 }
                });
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { x: 0.85, y: 0.85 }
                });

                // 2단계: 0.8초 뒤 공중에서 흩날리는 풍성한 은하수 샤워
                setTimeout(() => {
                    confetti({
                        particleCount: 120,
                        angle: 90,
                        spread: 120,
                        origin: { x: 0.5, y: 0.2 }
                    });
                }, 800);
            }
        }

        /**
         * 대성공 시 이진 코드를 분석하여 거대한 팝업창을 띄워주는 함수 (5비트 대응 렌더링)
         * @param {number} target - 포장 목표 숫자
         * @param {object} bags - 담긴 봉투 상태 리스트
         */
        function showSuccessModal(target, bags) {
            const modal = document.getElementById('successModal');
            const inner = modal.querySelector('div');
            
            document.getElementById('popupTarget').innerText = target;
            document.getElementById('popupTargetText').innerText = target;

            const bits = [16, 8, 4, 2, 1];
            let binaryStr = '';
            
            bits.forEach(bit => {
                const isActive = bags[bit];
                const bitVal = isActive ? '1' : '0';
                binaryStr += bitVal + ' ';

                const bitEl = document.getElementById('bit' + bit);
                bitEl.innerText = bitVal;
                
                if (isActive) {
                    bitEl.className = "w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-3xl md:text-4xl rounded-2xl transition-all shadow-md bg-emerald-500 text-white border-2 border-emerald-600 scale-105";
                } else {
                    bitEl.className = "w-12 h-12 md:w-14 md:h-14 flex items-center justify-center font-jua text-3xl md:text-4xl rounded-2xl transition-all shadow-md bg-slate-100 text-slate-400 border-2 border-slate-300";
                }
            });

            document.getElementById('popupBinaryText').innerText = binaryStr.trim();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                inner.classList.replace('scale-90', 'scale-100');
            }, 50);
        }

        /**
         * 대성공 팝업 모달을 닫는 함수
         */
        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            const inner = modal.querySelector('div');
            modal.classList.remove('opacity-100');
            inner.classList.replace('scale-100', 'scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        /**
         * [포장 완료] 누를 시 손님의 초코칩 목표량과 일치하는지 판별하는 수치 검증 프로세스 (5비트 수치 판정)
         */
        function checkPackingResult() {
            const target = parseInt(document.getElementById('targetSelect').value);
            let currentSum = 0;
            let binaryResult = '';

            const sizes = [16, 8, 4, 2, 1];
            sizes.forEach(size => {
                if (packedBags[size]) {
                    currentSum += size;
                    binaryResult += '1 ';
                } else {
                    binaryResult += '0 ';
                }
            });
            
            if (currentSum === target) {
                // 성공 상태
                playSuccessSound();
                
                // 신나는 폭죽 발사!
                triggerFireworks();

                // 교사용 대성공 이진 분석 대형 팝업 전개
                setTimeout(() => {
                    showSuccessModal(target, packedBags);
                }, 100);
            } else if (currentSum > target) {
                // 초과 실패 상태 (v1.25 레이아웃 반영: 플로팅 토스트로 안내)
                playFailSound();
                showFloatingToast(`너무 무거워요! 담은 초코칩(${currentSum}개)이 주문량(${target}개)을 넘었습니다.`, 'error');
            } else {
                // 부족 상태 (v1.25 레이아웃 반영: 플로팅 토스트로 안내)
                playFailSound();
                showFloatingToast(`쿠키가 모자라요! 담은 개수: ${currentSum}개 / 주문량: ${target}개`, 'warning');
            }
        }
    </script>
